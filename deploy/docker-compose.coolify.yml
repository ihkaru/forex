version: '3.8'

services:
  # ==============================================================================
  # 1. RUST QUANT ENGINE & API SERVER
  # Menjalankan algoritma Pola N, broker connector MT4, dan publish Traders Family
  # ==============================================================================
  api-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: forex-quant-api:latest
    container_name: forex_api_server
    restart: unless-stopped
    ports:
      # Port 5555 di-bind khusus ke 127.0.0.1 host Ubuntu Desktop
      # Aman: Hanya MT4 yang berjalan di Ubuntu Desktop Anda yang bisa terhubung!
      - "127.0.0.1:5555:5555"
    environment:
      - RUST_LOG=info
      - MT4_SOCKET_HOST=0.0.0.0
      - MT4_SOCKET_PORT=5555
      - PORT=5000
      # Kredensial Traders Family (Dapat diisi via Coolify Environment Variables)
      - TF_BASE_URL=${TF_BASE_URL:-https://api.tradersfamily.id}
      - TF_EMAIL=${TF_EMAIL:-}
      - TF_PASSWORD=${TF_PASSWORD:-}
      - TF_CHANNEL_ID=${TF_CHANNEL_ID:-}
      - TF_AUTH_TOKEN=${TF_AUTH_TOKEN:-}
    volumes:
      - forex_market_data:/app/data
      - forex_reports:/app/reports

  # ==============================================================================
  # 2. SVELTE 5 FRONTEND DASHBOARD (NGINX RUNTIME)
  # Menyajikan visual TradingView Canvas dan mem-proxy API & WebSocket ke Backend
  # ==============================================================================
  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: forex-quant-ui:latest
    container_name: forex_ui
    restart: unless-stopped
    depends_on:
      - api-server
    ports:
      # Port 3000 diekspos agar Coolify / Traefik bisa mengarahkan domain publik ke sini
      - "3000:80"
    environment:
      - PORT=80

volumes:
  forex_market_data:
    driver: local
  forex_reports:
    driver: local
